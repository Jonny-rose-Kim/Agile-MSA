server:
  port: 8086

spring:
  application:
    name: material-service

  datasource:
    url: jdbc:mariadb://lecturedb:3306/material_db?createDatabaseIfNotExist=true
    username: manager
    password: SqlDba-1
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MariaDBDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9000/oauth2/jwks
          issuer-uri: http://localhost:9000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.lecture.material: DEBUG

# 데모용 초기 데이터. materials 테이블이 비어 있을 때만 1회 적재한다.
# 운영에 올릴 때는 false 로 끈다.
app:
  seed:
    enabled: ${APP_SEED_ENABLED:true}

# 서비스 간 내부 API 호출 키. 호출하는 쪽(order-service)과 값이 같아야 한다.
# /api/materials/internal/** 은 이 키가 있어야 열린다.
internal:
  api-key: ${INTERNAL_API_KEY:msa-internal-key}
