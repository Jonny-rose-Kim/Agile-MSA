services:

  # Infrastructure

  mariadb:
    image: mariadb:11.2
    container_name: lecturedb
    environment:
      MYSQL_ROOT_PASSWORD: SqlDba-1
      MYSQL_DATABASE: lecture_db
      MYSQL_USER: manager
      MYSQL_PASSWORD: SqlDba-1
    ports:
      - "3379:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - lecture-net

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: lecture-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - lecture-net


  # Service Discovery

  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: lecture-eureka
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - lecture-net
  

  # Auth Server

  auth-server:
    image: msa-lecture/auth-server:1.0
    container_name: lecture-auth
    ports:
      - "9000:9000"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mariadb://lecturedb:3306/lecture_db
      - SPRING_DATASOURCE_USERNAME=manager
      - SPRING_DATASOURCE_PASSWORD=SqlDba-1
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      mariadb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9000/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    networks:
      - lecture-net


  # API Gateway

  api-gateway:
    image: msa-lecture/api-gateway:1.0
    container_name: lecture-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://auth-server:9000/oauth2/jwks
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://localhost:8080
      # 프리빌트 이미지라 소스가 없다. 라우트 목록을 통째로 얹어 교체한다.
      - SPRING_CONFIG_ADDITIONAL_LOCATION=/config/routes.yml
    volumes:
      - ./gateway/routes.yml:/config/routes.yml:ro
    depends_on:
      eureka-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
    networks:
      - lecture-net


  # Microservices

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: lecture-user
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mariadb://lecturedb:3306/lecture_db
      - SPRING_DATASOURCE_USERNAME=manager
      - SPRING_DATASOURCE_PASSWORD=SqlDba-1
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://auth-server:9000/oauth2/jwks
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://auth-server:9000
    depends_on:
      mariadb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
    networks:
      - lecture-net

  material-service:
    build:
      context: ./material-service
      dockerfile: Dockerfile
    container_name: lecture-material
    ports:
      - "8086:8086"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      # 서비스별 독립 스키마. init-db/00_databases.sql 이 생성한다.
      - SPRING_DATASOURCE_URL=jdbc:mariadb://lecturedb:3306/material_db?createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=manager
      - SPRING_DATASOURCE_PASSWORD=SqlDba-1
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://auth-server:9000/oauth2/jwks
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://auth-server:9000
    depends_on:
      mariadb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
    networks:
      - lecture-net

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: lecture-order
    ports:
      - "8087:8087"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      # 서비스별 독립 스키마. init-db/00_databases.sql 이 생성한다.
      - SPRING_DATASOURCE_URL=jdbc:mariadb://lecturedb:3306/order_db?createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=manager
      - SPRING_DATASOURCE_PASSWORD=SqlDba-1
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://auth-server:9000/oauth2/jwks
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://auth-server:9000
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      mariadb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      material-service:
        condition: service_started
    networks:
      - lecture-net


  enrollment-service:
    build:
      context: ./enrollment-service
      dockerfile: Dockerfile
    container_name: lecture-enrollment
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mariadb://lecturedb:3306/lecture_db
      - SPRING_DATASOURCE_USERNAME=manager
      - SPRING_DATASOURCE_PASSWORD=SqlDba-1
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://auth-server:9000/oauth2/jwks
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://auth-server:9000
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      mariadb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - lecture-net

  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: lecture-payment
    ports:
      - "8084:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mariadb://lecturedb:3306/lecture_db
      - SPRING_DATASOURCE_USERNAME=manager
      - SPRING_DATASOURCE_PASSWORD=SqlDba-1
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://auth-server:9000/oauth2/jwks
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://auth-server:9000
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - ORDER_SERVICE_URL=http://order-service:8087
    depends_on:
      mariadb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      order-service:
        condition: service_started
    networks:
      - lecture-net

  recommend-service:
    build:
      context: ./recommend-service
      dockerfile: Dockerfile
    container_name: lecture-recommend
    ports:
      - "8085:8085"
    environment:
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka
      - EUREKA_INSTANCE_HOST=recommend-service
      - JWT_ISSUER_URI=http://localhost:8080
      - JWK_SET_URI=http://auth-server:9000/oauth2/jwks
      - MATERIAL_SERVICE_URL=http://material-service:8086
      - ORDER_SERVICE_URL=http://order-service:8087
      # 수요 예측의 근거가 되는 발주 이력이 아직 합성 데이터라 mock 으로 둔다.
      # 실제 material/order 서비스를 호출하려면 false 로 바꾼다. (README 참고)
      - MOCK_MODE=true
      # llm 으로 바꾸고 OPENAI_API_KEY 를 주면 OpenAI + web_search 예측을 쓴다.
      # 키가 없으면 합성 추세(SYNTHETIC_TREND)로 자동 폴백한다.
      - FORECASTER=${FORECASTER:-mock}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      eureka-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
      material-service:
        condition: service_started
      order-service:
        condition: service_started
    networks:
      - lecture-net


# Volumes & Networks

volumes:
  mariadb_data:
  kafka_data:

networks:
  lecture-net:
    driver: bridge